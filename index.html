<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--primary:#1B3A4B;--accent:#C0902C;--secondary:#43555F;--light:#FBF8F1;--border:#DED5C6;--danger:#B24E36;--ok:#2E8B57;--radius:10px}
body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--light);color:var(--primary);padding-bottom:84px}
header.app{position:sticky;top:0;z-index:50;background:var(--primary);color:var(--light);padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header.app h1{font-size:16.5px;font-weight:700}

.hbtn{border:1px solid #5b7080;background:transparent;color:#DCE5E9;font:600 12px inherit;font-family:inherit;padding:6px 11px;border-radius:8px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:16px}
.view{display:none}.view.active{display:block}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}

.btn.block{width:100%}.btn.outline{background:#fff;border:1px solid var(--border);color:var(--primary)}
.btn.sm{padding:7px 10px;font-size:12px}.btn.danger{background:#fff;border:1px solid #E3C4BA;color:var(--danger)}
.btn.dark{background:var(--primary)}
.field{margin-bottom:10px}

input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:8px;font:14px inherit;font-family:inherit;background:#fff;color:var(--primary)}

.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;color:#fff;background:var(--ok);white-space:nowrap}

.chip.on{color:#fff;border-color:transparent}.chip.tg.on{background:var(--accent)}
canvas{width:100%;height:230px;display:block}

.dbox{border:1px solid var(--border);border-radius:8px;padding:9px 10px;background:var(--light)}

.up{color:var(--ok)}.dn{color:var(--danger)}.fl{color:var(--secondary)}

.back{border:0;background:none;color:var(--secondary);font:600 13px inherit;font-family:inherit;margin-bottom:10px;cursor:pointer}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:60}

nav.bottom button.on{color:var(--accent)}nav.bottom button span{display:block;font-size:18px;margin-bottom:2px}
.sug{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:7px;font-size:12.5px;background:#fff}
.sug b.f{color:var(--danger);text-decoration:line-through;text-decoration-color:#e0b0a4}.sug b.t{color:var(--ok)}
.sug .w{color:var(--secondary);font-size:11.5px;margin-top:3px}
.orig{background:var(--light);border-radius:8px;padding:9px 10px;font-size:13.5px;white-space:pre-wrap;line-height:1.6}
.fix{background:#EAF5EE;border-radius:8px;padding:9px 10px;font-size:13.5px;white-space:pre-wrap;line-height:1.6;margin-top:6px}
.lbl{font-size:11px;font-weight:700;color:var(--secondary);margin:9px 0 4px}
.react{font-size:20px;border:1px solid var(--border);background:#fff;border-radius:8px;padding:3px 9px;cursor:pointer}.react.on{background:#F3E7C9;border-color:var(--accent)}
.stars{color:var(--accent);letter-spacing:1px}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:400;max-width:90%}
details{border-top:1px dashed var(--border);padding:8px 0;font-size:13px}summary{cursor:pointer;color:var(--secondary);font-size:12.5px}
details.card{border:1px solid var(--border)}
.wl{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--border);font-size:13.5px;line-height:1.55}.wl:first-of-type{border-top:0}
.dy{background:#fbe7b0;border-radius:3px;padding:0 2px;color:#6b4a00}.dx{background:#f6c9bf;border-radius:3px;padding:0 2px;color:#8a2a14}.dx2{color:#B24E36}
.trow{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:8px;border:1px solid transparent;margin:2px 0}.trow.unk{border-color:#e7b9ad;background:#fdf1ee}.trow b{width:22px}.tq{flex:1;font-size:11px;color:var(--secondary)}
.tb{min-width:34px;height:30px;border:1px solid var(--border);background:#fff;border-radius:8px;font:600 13px inherit;font-family:inherit;cursor:pointer}.tb.g{background:#2E8B57;color:#fff;border-color:#2E8B57}.tb.r{background:#B24E36;color:#fff;border-color:#B24E36}
.opts{display:flex;flex-direction:column;gap:5px}.opt{text-align:left;padding:8px 10px;border:1px solid var(--border);background:#fff;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.blr{filter:blur(2.5px);background:#f3d9a0;border-radius:4px;padding:0 3px;cursor:pointer;user-select:none;-webkit-user-select:none}
.blr.m{filter:none;border:1.5px dashed #C0902C;background:#fff7e0;color:#C0902C}.blr.sel{outline:2px solid var(--accent)}
.cok{background:#e3f4ea;color:#1f6b43;border-radius:4px;padding:0 3px;font-weight:700}.cgone{color:#9aa;}
.ct,.cdone{background:#fdebd0;border-radius:4px;padding:0 3px}.cdone{background:#e3f4ea}.ct small,.cdone small{color:#B24E36;font-weight:700}
.cpage{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px;line-height:2.1;font-size:15px}
.cbar{margin-top:8px;background:var(--light);border-radius:10px;padding:10px;font-size:13px}
.pv{border-radius:4px;padding:0 3px;border:1px dashed #bbb;color:#999;cursor:pointer}.pv.on{border:1px solid #C0902C;background:#f3d9a0;color:#333}.pv small{color:#B24E36;font-weight:700;margin-left:2px}
.mk{flex:0 0 30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:8px;font:700 15px inherit;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.wfix{margin-top:5px;padding:7px 9px;font-size:13px}
.banner{background:#F3E7C9;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#loading{display:none;position:fixed;inset:0;background:rgba(251,248,241,.92);z-index:500;align-items:center;justify-content:center;font-size:14px;color:var(--secondary)}#loading.on{display:flex}
#printArea{display:none;position:fixed;inset:0;background:#fff;z-index:300;overflow:auto}#printArea.open{display:block}
#printArea .tb{position:sticky;top:0;background:var(--primary);padding:10px;display:flex;gap:8px;justify-content:flex-end}
.paper{max-width:720px;margin:0 auto;padding:26px 30px;color:#000;font-size:15px;line-height:1.7}
.paper h2{font-size:20px;margin-bottom:4px}.paper h3{font-size:15px;margin:18px 0 6px;border-bottom:2px solid #000;padding-bottom:3px}
.paper .info{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}.paper .it{margin:12px 0}
.paper .ln{display:inline-block;border-bottom:1px solid #000;min-width:170px}.pbreak{page-break-before:always}
@media print{body>*:not(#printArea){display:none!important}#printArea{position:static;overflow:visible;display:block}#printArea .tb{display:none}body{padding:0;background:#fff}}
</style>

<script>
/* =====================================================================
   유틸
===================================================================== */
const PKEY='eng_growth_ptoken';
const COLORS=['#1B3A4B','#C0902C','#2E8B57','#B24E36','#6B5B95','#3A7CA5'];
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const md=d=>String(d||'').slice(5).replace('-','/');
const DOW=['일','월','화','수','목','금','토'];
const dow=d=>DOW[new Date(d+'T00:00:00').getDay()];
const byDesc=(a,b)=>String(b.date).localeCompare(String(a.date));
const byAsc=(a,b)=>String(a.date).localeCompare(String(b.date));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lines=s=>String(s||'').split(/\n/).map(x=>x.trim()).filter(Boolean);
const hash=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7);
const clean=o=>JSON.parse(JSON.stringify(o));
const newToken=()=>{const a=new Uint8Array(20);(window.crypto||{getRandomValues:x=>x.forEach((_,i)=>x[i]=Math.floor(Math.random()*256))}).getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('')};
const nick=st=>{const n=(st.name||'').replace(/\(.*?\)/g,'').trim();return /^[가-힣]{3}$/.test(n)?n.slice(1):n};
function josa(w,a,b){const c=w.charCodeAt(w.length-1);if(c>=0xAC00&&c<=0xD7A3)return w+(((c-0xAC00)%28)?a:b);return w+b}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t).then(()=>toast('복사했어요'),()=>fbCopy(t));
  fbCopy(t)
}
function fbCopy(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('복사했어요')}catch(e){toast('복사 실패')}a.remove()}
function errText(e){
  const c=(e&&e.code)||'';
  const m={'permission-denied':'권한이 없어요. Firestore 규칙 설정을 확인해 주세요.','auth/invalid-credential':'이메일 또는 비밀번호를 확인해 주세요.','auth/wrong-password':'이메일 또는 비밀번호를 확인해 주세요.','auth/user-not-found':'이메일 또는 비밀번호를 확인해 주세요.','auth/invalid-email':'이메일 형식을 확인해 주세요.','auth/too-many-requests':'시도가 너무 많아요. 잠시 후 다시 해 주세요.','auth/unauthorized-domain':'이 주소가 Firebase ‘승인된 도메인’에 없어요.','auth/invalid-api-key':'Firebase 설정값(apiKey)이 올바르지 않아요.','auth/api-key-not-valid.-please-pass-a-valid-api-key.':'Firebase 설정값(apiKey)이 올바르지 않아요.','auth/network-request-failed':'인터넷 연결을 확인해 주세요.','unavailable':'서버에 연결할 수 없어요.','auth/operation-not-allowed':'Firebase에서 해당 로그인 방법이 꺼져 있어요.'};
  return m[c]||c||(e&&e.message)||'알 수 없는 오류';
}
function fail(e){console.error(e);toast('⚠️ '+errText(e))}

/* =====================================================================
   영어 일기 자동 교정 엔진 (규칙 기반)
===================================================================== */
const IRREG={goed:'went',wented:'went',eated:'ate',runned:'ran',buyed:'bought',comed:'came',maked:'made',taked:'took',tooked:'took',getted:'got',haved:'had',writed:'wrote',drinked:'drank',swimmed:'swam',sleeped:'slept',felled:'fell',speaked:'spoke',thinked:'thought',teached:'taught',bringed:'brought',gived:'gave',finded:'found',meeted:'met',sitted:'sat',standed:'stood',singed:'sang',catched:'caught',telled:'told',knowed:'knew',growed:'grew',drawed:'drew',sayed:'said'};
const PAST={go:'went',play:'played',eat:'ate',have:'had',see:'saw',watch:'watched',make:'made',buy:'bought',meet:'met',come:'came',do:'did',like:'liked',visit:'visited',study:'studied',take:'took',get:'got',want:'wanted',enjoy:'enjoyed',walk:'walked',cook:'cooked',clean:'cleaned',help:'helped',call:'called',write:'wrote',draw:'drew',ride:'rode',swim:'swam',run:'ran',sing:'sang',learn:'learned',talk:'talked'};
const third=v=>{if(v==='go')return'goes';if(v==='have')return'has';if(v==='do')return'does';if(/(ch|sh|s|x|z)$/.test(v))return v+'es';if(/[^aeiou]y$/.test(v))return v.slice(0,-1)+'ies';return v+'s'};
const BASE3={};Object.keys(PAST).forEach(v=>BASE3[third(v)]=v);
const PASTBASE={};Object.keys(PAST).forEach(v=>PASTBASE[PAST[v]]=v);
const mcase=(m,t)=>m[0]===m[0].toUpperCase()&&m[0]!==m[0].toLowerCase()?t[0].toUpperCase()+t.slice(1):t;
const CONTR={dont:"don't",doesnt:"doesn't",didnt:"didn't",cant:"can't",isnt:"isn't",wasnt:"wasn't",im:"I'm",ive:"I've",thats:"that's",whats:"what's"};
const DAYS='monday|tuesday|wednesday|thursday|friday|saturday|sunday';
function checkText(src){
  let t=String(src).replace(/[ \t]{2,}/g,' ').replace(/[ \t]+\n/g,'\n').trim();
  const sugs=[];
  const add=(from,to,why,tag)=>{if(from!==to&&!sugs.some(s=>s.from===from&&s.to===to))sugs.push({from,to,why,tag});return to};
  t=t.replace(/\b(dont|doesnt|didnt|cant|isnt|wasnt|im|ive|thats|whats)\b/gi,m=>add(m,mcase(m,CONTR[m.toLowerCase()]),'줄임말에는 작은따옴표(’)를 넣어요','철자'));
  t=t.replace(/\bi\b/g,()=>add('i','I','‘I’(나)는 문장 어디에서든 대문자로 써요','대문자'));
  t=t.replace(new RegExp('\\b('+Object.keys(IRREG).join('|')+')\\b','gi'),m=>add(m,mcase(m,IRREG[m.toLowerCase()]),'불규칙 동사는 과거형이 따로 있어요','시제'));
  t=t.replace(/\bI\s+(is|are)\b/g,m=>add(m,'I am','‘I’ 다음에는 am을 써요','수일치'));
  t=t.replace(/\b(you|we|they)\s+(is|am|has)\b/gi,(m,p,v)=>add(m,p+(v.toLowerCase()==='has'?' have':' are'),v.toLowerCase()==='has'?'you/we/they에는 have를 써요':'you/we/they 다음에는 are를 써요','수일치'));
  t=t.replace(/\bI\s+has\b/g,m=>add(m,'I have','‘I’ 다음에는 have를 써요','수일치'));
  t=t.replace(/\b(he|she|it)\s+(are|am)\b/gi,(m,p)=>add(m,p+' is','he/she/it 다음에는 is를 써요','수일치'));
  t=t.replace(/\b(he|she|it)\s+have\b/gi,(m,p)=>add(m,p+' has','he/she/it에는 has를 써요','수일치'));
  t=t.replace(/\b(he|she|it)\s+don't\b/gi,(m,p)=>add(m,p+" doesn't",'he/she/it에는 doesn’t를 써요','수일치'));
  t=t.replace(/\bI\s+am\s+(agree|like|love|want|need|have|go|play|think|know)\b/gi,(m,v)=>add(m,'I '+v.toLowerCase(),'동사 앞에는 am이 필요 없어요 (예: I agree)','문법'));
  t=t.replace(/\b(he|she|it)\s+(go|have|like|play|want|eat|love|make|need|study|watch|live|come|see|know|write|help|work|do|say|take|get)\b/gi,(m,p,v)=>add(m,p+' '+third(v.toLowerCase()),'he/she/it 뒤 현재형 동사에는 -s를 붙여요','수일치'));
  t=t.replace(/\b(doesn't|does not)\s+(goes|has|likes|plays|wants|eats|loves|makes|needs|studies|watches|lives|comes|sees|knows)\b/gi,(m,a,v)=>add(m,a+' '+BASE3[v.toLowerCase()],'doesn’t 뒤에는 동사 원형을 써요','문법'));
  t=t.replace(/\b(didn't|did not)\s+(went|had|ate|saw|made|bought|came|did|took|got|played|watched|liked|wanted)\b/gi,(m,a,v)=>add(m,a+' '+PASTBASE[v.toLowerCase()],'didn’t 뒤에는 동사 원형을 써요','시제'));
  t=t.replace(new RegExp('\\bin ('+DAYS+')\\b','gi'),(m,d)=>add(m,'on '+d,'요일 앞에는 on을 써요','전치사'));
  t=t.replace(new RegExp('\\b('+DAYS+')\\b','g'),m=>add(m,m[0].toUpperCase()+m.slice(1),'요일 이름은 대문자로 시작해요','대문자'));
  t=t.replace(/\bat (the )?morning\b/gi,m=>add(m,'in the morning','아침·오후 앞에는 in the를 써요','전치사'));
  t=t.replace(/\bat (the )?afternoon\b/gi,m=>add(m,'in the afternoon','아침·오후 앞에는 in the를 써요','전치사'));
  t=t.replace(/\bin (the )?night\b/gi,m=>add(m,'at night','밤에는 at night라고 해요','전치사'));
  t=t.replace(/\bgo to home\b/gi,m=>add(m,'go home','home 앞에는 to를 쓰지 않아요','전치사'));
  t=t.replace(/\b(homeworks|informations|advices|furnitures)\b/gi,m=>add(m,m.slice(0,-1),'셀 수 없는 말이라 -s를 붙이지 않아요','가산/불가산'));
  t=t.replace(/\bI\s+have\s+(\w+)\s+years?\s+old\b/gi,(m,n)=>add(m,'I am '+n+' years old','나이는 ‘I am ~ years old’로 말해요','문법'));
  t=t.replace(/\bvery\s+(like|love)\b/gi,(m,v)=>add(m,'really '+v.toLowerCase(),'like/love 앞에는 very 대신 really를 써요','어순'));
  t=t.replace(/\b(a|an)\s+([a-z]+)/gi,(m,art,w)=>{
    const lw=w.toLowerCase();
    const vowel=(/^[aeiou]/.test(lw)&&!/^(uni|use|usu|eu|one|once)/.test(lw))||/^(hour|honest|honor)/.test(lw);
    const want=vowel?'an':'a';
    if(art.toLowerCase()===want)return m;
    const fixed=mcase(art,want)+' '+w;
    return add(m,fixed,'‘'+w+'’는 '+(vowel?'모음':'자음')+' 소리로 시작해서 '+(want==='an'?'an을':'a를')+' 써요','관사');
  });
  const TM=/\b(yesterday|last (night|week|weekend|month|year|summer|winter|sunday|monday|tuesday|wednesday|thursday|friday|saturday)|ago)\b/i;

  t=t.replace(/[^.!?\n]+[.!?]*/g,s=>{
    if(!TM.test(s))return s;
    return s.replace(pastRe,(m,p1,v1,p2,v2)=>p1?add(m,p1+' '+PAST[v1],'어제·지난주 같은 지나간 일은 과거형으로 써요','시제'):add(m,p2+' '+PAST[BASE3[v2]],'어제·지난주 같은 지나간 일은 과거형으로 써요','시제'));
  });
  let capFix=false;
  t=t.replace(/(^|[.!?]\s+|\n)([a-z])/g,(m,pre,c)=>{capFix=true;return pre+c.toUpperCase()});
  if(capFix)sugs.push({from:'소문자로 시작한 문장',to:'문장 첫 글자는 대문자',why:'문장이 시작할 때는 첫 글자를 대문자로 써요',tag:'대문자'});
  let punFix=false;
  t=t.split('\n').map(l=>{const x=l.trim();if(x&&!/[.!?"”)]$/.test(x)){punFix=true;return x+'.'}return l}).join('\n');
  if(punFix)sugs.push({from:'끝에 마침표 없음',to:'문장 끝에 . ! ? 쓰기',why:'문장이 끝나면 마침표를 찍어요',tag:'문장부호'});
  const words=(String(src).match(/[A-Za-z']+/g)||[]).length;
  const sents=Math.max(1,(String(src).match(/[.!?]+/g)||[]).length);
  return {corrected:t,sugs,words,sents};
}

function bySubject(st){const m={};[...st.scores].sort(byAsc).forEach(r=>{(m[r.subject]=m[r.subject]||[]).push(r)});return m}
function deltas(st){
  const m=bySubject(st),out=[];
  S.subjects.forEach(sub=>{const a=m[sub];if(!a||!a.length)return;const l=a[a.length-1],p=a.length>1?a[a.length-2].score:(l.prevScore!=null&&l.prevScore!==''?+l.prevScore:null);out.push({sub,last:l.score,delta:p===null?null:l.score-p,first:a[0].score,avg:l.avg,chg:l.chg})});
  return out;
}
function overall(st){const d=deltas(st).filter(x=>x.delta!==null);return d.length?d.reduce((a,x)=>a+x.delta,0)/d.length:null}
const fmtD=d=>d===null?'신규':(d>0?'▲ '+d:d<0?'▼ '+Math.abs(d):'－ 0');
const clsD=d=>d===null||d===0?'fl':d>0?'up':'dn';
function topTag(recs){const c={};recs.forEach(r=>(r.tags||[]).forEach(t=>c[t]=(c[t]||0)+1));const e=Object.entries(c).sort((a,b)=>b[1]-a[1]);return e.length?e[0][0]:null}
function insights(st){
  const out=[],m=bySubject(st);
  S.subjects.forEach(sub=>{
    const a=m[sub];if(!a||a.length<2)return;
    const v=a.map(r=>r.score),n=v.length;
    let up=0,dn=0;
    for(let i=n-1;i>0&&v[i]>v[i-1];i--)up++;
    for(let i=n-1;i>0&&v[i]<v[i-1];i--)dn++;
    if(up>=2)out.push({type:'up',sub,text:`최근 ${up}번 연속 올랐어요! 🎉`});
    else if(dn>=1){
      const tag=topTag(a.slice(-dn)),diff=v[n-2]-v[n-1];
      const head=dn>=2?`최근 ${dn}번 연속 내려갔어요. `:'';
      out.push({type:'drop',sub,text:tag?`${head}‘${tag}’ 문제를 자주 틀려서 조금 떨어졌어요. 같이 보완할게요.`:`${head}지난번보다 ${diff}점 내려갔어요. 어떤 부분이 어려웠는지 같이 살펴볼게요.`});
    }
    else if(n>=3&&v[n-1]===Math.max(...v))out.push({type:'best',sub,text:`지금까지 중 가장 높은 점수예요! 👏`});
    else if(up===1)out.push({type:'up',sub,text:`지난번보다 ${v[n-1]-v[n-2]}점 올랐어요.`});
  });
  S.subjects.forEach(sub=>{const a=m[sub];if(!a||!a.length)return;const l=a[a.length-1];if(l.avg!=null&&l.avg!==''){const diff=l.score-l.avg;out.push({type:'best',avg:true,sub,text:diff>=0?`반 평균(${l.avg})보다 ${diff}점 높아요.`:`반 평균(${l.avg})보다 ${-diff}점 낮아요. 같이 보완해 가요.`})}});
  const o={up:0,best:1,drop:2};out.sort((a,b)=>o[a.type]-o[b.type]);
  return out;
}
function tagStats(st){
  const c={};

  st.wrongs.filter(w=>!w.mastered).forEach(w=>{if(w.tag)c[w.tag]=(c[w.tag]||0)+w.count});
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4);
}

let showAvg=true;
const meanOf=a=>a.reduce((x,r)=>x+r.score,0)/a.length;
function drawChart(cv,st,active){
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');if(!c)return;
  c.scale(dpr,dpr);c.clearRect(0,0,W,H);
  const m=bySubject(st),subs=S.subjects.filter(s=>m[s]&&active.includes(s));
  const L=34,R=16,T=14,B=26,pw=W-L-R,ph=H-T-B;
  c.font='10.5px sans-serif';c.textBaseline='middle';
  const all=subs.flatMap(s=>m[s]);
  let yMin=0,yMax=100;
  if(all.length){const vals=all.map(r=>r.score);subs.forEach(s=>{m[s].forEach(r=>{if(r.avg!=null&&r.avg!=='')vals.push(+r.avg)});if(showAvg)vals.push(meanOf(m[s]))});const lo=Math.min(...vals),hi=Math.max(...vals);yMin=Math.max(0,Math.floor((lo-10)/10)*10);yMax=Math.min(100,Math.ceil((hi+5)/10)*10);if(yMax-yMin<20)yMin=Math.max(0,yMax-20)}
  const Y=v=>T+ph-(v-yMin)/(yMax-yMin)*ph;
  c.strokeStyle='#E8E1D3';c.fillStyle='#43555F';c.lineWidth=1;c.textAlign='right';
  for(let v=yMin;v<=yMax;v+=10){c.beginPath();c.moveTo(L,Y(v));c.lineTo(W-R,Y(v));c.stroke();c.fillText(v,L-6,Y(v))}
  if(!all.length){c.textAlign='center';c.fillText('성적을 입력하면 그래프가 나타납니다',W/2,H/2);return}
  const ts=all.map(r=>+new Date(r.date)),t0=Math.min(...ts),t1=Math.max(...ts);
  const X=d=>{const t=+new Date(d);return t1===t0?L+pw/2:L+(t-t0)/(t1-t0)*pw};
  const dates=[...new Set(all.map(r=>r.date))].sort();
  c.textAlign='center';c.textBaseline='top';c.fillStyle='#43555F';
  let lx=-99;dates.forEach(d=>{const x=X(d);if(x-lx>46){c.fillText(md(d),x,H-B+8);lx=x}});
  c.textBaseline='middle';
  let hasClass=false;
  subs.forEach(s=>{
    const col=subjColor(s),a=m[s];
    if(showAvg){
      const mv=meanOf(a),y=Y(mv);
      c.save();c.globalAlpha=.55;c.strokeStyle=col;c.fillStyle=col;c.lineWidth=1.3;c.setLineDash([5,4]);
      c.beginPath();c.moveTo(L,y);c.lineTo(W-R,y);c.stroke();c.setLineDash([]);
      c.font='bold 10px sans-serif';c.textAlign='left';c.fillText('평균 '+Math.round(mv),L+4,y-7);c.restore();
    }
    const ca=a.filter(r=>r.avg!=null&&r.avg!=='');
    if(ca.length){
      hasClass=true;c.save();c.strokeStyle='#8a9aa2';c.fillStyle='#8a9aa2';c.lineWidth=1.6;c.setLineDash([2,3]);
      c.beginPath();ca.forEach((r,i)=>{const x=X(r.date),y=Y(+r.avg);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();c.setLineDash([]);
      ca.forEach(r=>{const x=X(r.date),y=Y(+r.avg);c.beginPath();c.moveTo(x,y-4.5);c.lineTo(x+4.5,y);c.lineTo(x,y+4.5);c.lineTo(x-4.5,y);c.closePath();c.fill()});
      c.restore();
    }
  });
  if(hasClass||showAvg){c.save();c.font='10px sans-serif';c.textAlign='right';c.fillStyle='#6b7b84';c.textBaseline='middle';c.fillText((showAvg?'┄ 내 평균  ':'')+(hasClass?'◆ 반 평균':''),W-R,6);c.restore()}
  subs.forEach(s=>{
    const col=subjColor(s),a=m[s];
    c.strokeStyle=col;c.fillStyle=col;c.lineWidth=2.2;c.lineJoin='round';
    c.beginPath();a.forEach((r,i)=>{const x=X(r.date),y=Y(r.score);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();
    a.forEach((r,i)=>{
      const x=X(r.date),y=Y(r.score);
      c.beginPath();c.arc(x,y,r.comment?4.8:3.4,0,7);c.fill();
      if(r.comment){c.strokeStyle='#fff';c.lineWidth=1.5;c.stroke();c.strokeStyle=col;c.lineWidth=2.2}
      if(i===a.length-1){c.textAlign='left';c.font='bold 11px sans-serif';c.fillText(r.score,Math.min(x+6,W-22),y-9);c.font='10.5px sans-serif'}
    });
  });
}

function parseWords(raw){
  return String(raw||'').split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean).map(s=>{
    const m=s.match(/^([A-Za-z][A-Za-z' \-]*?)\s*[=:]\s*(.+)$/)||s.match(/^([A-Za-z][A-Za-z' \-]*?)\s+([가-힣].*)$/);
    return {q:m?m[1].trim():s,ans:m?m[2].trim():''};
  });
}
function parseGram(raw){
  return lines(raw).map(l=>{
    const p=l.split(/\s*(?:→|->|=>)\s*/);const q=p[0].trim();let ans=(p[1]||'').trim();
    const r=checkText(q);if(!ans&&r.corrected!==q)ans=r.corrected;
    return {q,ans,tag:(r.sugs[0]&&r.sugs[0].tag)||'문법'};
  });
}
const ATT=['아쉬움','보통','아주 좋음'],HW=['미제출','일부','완료'];
function genMsg(st,f){
  const n=nick(st),seed=(f.seed||0)+Math.abs(hash(f.date||'')),P=st.parent||(n+' 보호자님');
  let k=0;const pk2=a=>a[(seed+(k++))%a.length];
  const hasV=f.vN!==''&&f.vN!==null&&+f.vT>0,vN=+f.vN,vT=+f.vT,r=hasV?vN/vT:0;
  const words=parseWords(f.wordsRaw).map(w=>w.q),ss=lines(f.sentence);
  const ins=f.insight?insights(st).find(i=>!i.avg):null;
  const L=[];
  if(f.attend==='a'){
    const mk=(st.makeups||[]).find(m=>m.date===f.date&&m.status==='예정'&&m.makeupDate);
    const when=mk?`보충 수업은 ${md(mk.makeupDate)}${mk.time?' '+mk.time:''}에 진행해요.`:'보충 수업 일정은 곧 따로 안내드릴게요.';
    const nt=f.note&&f.note.trim()?'\n'+f.note.trim():'';
    return f.tone==='short'?`${P}, ${n} 오늘 결석으로 기록했어요. ${when}${nt}`:`${P}, 안녕하세요. 오늘 ${josa(n,'은','는')} 수업에 나오지 못했어요. 괜찮으니 너무 걱정 마세요 🙂\n${when}\n오늘 나간 내용은 보충 때 함께 챙길게요.${nt}`;
  }
  if(f.tone==='short'){
    const bits=[];if(f.attend==='l')bits.push('지각');if(hasV)bits.push(`단어 ${vN}/${vT}`);bits.push('태도 '+ATT[f.att]);bits.push('숙제 '+HW[f.hw]);
    L.push(`${P}, ${n} 오늘 수업: ${bits.join(' · ')}.`);
    if(words.length)L.push(`다시 볼 단어: ${words.join(', ')}`);
    if(ss.length)L.push(`오늘 문장: ${ss.join(' / ')}`);
    if(f.note&&f.note.trim())L.push(f.note.trim());
    if(ins)L.push(`📈 ${ins.sub} · ${ins.text}`);
    return L.join('\n');
  }
  L.push(pk2([`${P}, 안녕하세요 😊 오늘 ${josa(n,'이','가')} 수업한 소식 전해드려요.`,`${P}, 안녕하세요! 오늘 ${n} 수업 이야기 알려드릴게요.`]));
  if(f.attend==='l')L.push('오늘은 조금 늦게 도착해서 앞부분은 따로 챙겼어요.');
  if(hasV){
    let s;
    if(r>=0.9)s=pk2([`오늘 단어시험은 ${vN}/${vT}로 아주 잘 봤어요 👏`,`단어시험 ${vN}/${vT}! 꼼꼼하게 잘 외워 왔어요 👏`]);
    else if(r>=0.7)s=pk2([`단어시험은 ${vN}/${vT}로 차근차근 잘 따라오고 있어요.`,`단어시험 ${vN}/${vT}, 꾸준히 좋아지고 있어요.`]);
    else s=pk2([`단어시험은 ${vN}/${vT}였어요. 아직 낯선 단어가 있었지만 괜찮아요, 같이 다시 볼게요 🙂`,`오늘 단어시험은 ${vN}/${vT}였어요. 조금 어려웠던 단어는 제가 다시 챙길게요 🙂`]);
    const prev=[...st.daily].filter(x=>x.date<f.date&&x.vN!==''&&+x.vT>0).sort(byDesc)[0];
    if(prev&&r-(prev.vN/prev.vT)>=0.1)s+=' 지난번보다 점수가 올랐어요 📈';
    L.push(s);
  }
  if(words.length)L.push(`다시 확인할 단어는 ${words.join(', ')}예요. 오답노트에 담아 두었으니 주말에 복습 테스트로 다시 볼게요.`);
  L.push([
    pk2(['집중이 흐트러지는 순간도 있었지만 끝까지 해보려는 모습이 보였어요. 내일 더 응원해 줄게요 🌱','오늘은 조금 힘들어 보였어요. 너무 걱정 마세요, 제가 잘 살펴볼게요 🌱']),
    pk2(['차분하게 잘 따라와 주었어요 🙂','수업에 무리 없이 잘 참여했어요 🙂']),
    pk2(['수업 태도가 정말 좋았어요. 발표도 적극적이었어요 🌟','끝까지 집중해서 열심히 참여했어요 🌟'])
  ][f.att]);
  L.push([
    '숙제를 못 해와서 수업 시간에 같이 챙겼어요. 이번 주는 한 번만 같이 신경 써 주시면 좋겠어요 🙏',
    '숙제는 일부만 해와서 다음 시간에 마저 하기로 했어요.',
    '숙제도 빠짐없이 잘 해왔어요 ✅'
  ][f.hw]);
  if(ss.length)L.push(`오늘 배운 문장은 “${ss.join('” / “')}”이에요. 집에서 한 번 소리 내어 읽어보게 해 주세요 🗣️`);
  if(f.note&&f.note.trim())L.push(f.note.trim());
  if(ins)L.push(`📈 성적 소식: ${ins.sub} 영역, ${ins.text}`);
  L.push(pk2(['오늘도 수고 많았어요. 궁금하신 점은 언제든 편하게 말씀해 주세요 😊','항상 믿고 맡겨 주셔서 감사합니다 🙏']));
  return L.join('\n');
}
function addWrong(st,w,date){
  const key=w.kind+':'+w.q.toLowerCase();
  const ex=st.wrongs.find(x=>x.kind+':'+x.q.toLowerCase()===key);
  if(ex){ex.count++;ex.last=date;ex.mastered=false;if(w.ans)ex.ans=w.ans;if(w.tag)ex.tag=w.tag}

}

function newDraft(st,date){
  const ex=st.daily.find(x=>x.date===date);
  if(ex)return {attend:'p',setId:'',wrongIdx:[],...ex,seed:0};
  const last=[...st.daily].sort(byDesc)[0];
  return {date,attend:'p',setId:'',wrongIdx:[],vN:'',vT:last?last.vT:20,wordsRaw:'',gramRaw:'',att:2,hw:2,sentence:'',note:'',tone:'warm',insight:true,msg:'',seed:0};
}

function setSeg(b,k,v){draft[k]=v;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}

   <div class="field"><label>출결</label><div class="seg">${segBtns('attend',[['p','🙂 출석'],['l','⏰ 지각'],['a','🚫 결석']],d.attend)}</div><p class="note" style="margin-top:4px">결석을 저장하면 보충 수업 목록에 자동으로 올라가요.</p></div>
   ${S.wordsets.length?`<div class="field"><label>단어장으로 입력 <small>(선택 · 틀린 단어만 탭 → 점수·틀린 단어 자동 입력)</small></label><select id="dSet" onchange="pickSet(this.value)"><option value="">직접 입력</option>${S.wordsets.map(w=>`<option value="${w.id}" ${w.id===d.setId?'selected':''}>${esc(w.name)} (${w.words.length})</option>`).join('')}</select><div class="chips" id="dSetChips" style="margin-top:8px">${setChips()}</div></div>`:''}
   <div class="field"><label>수업 태도</label><div class="seg">${segBtns('att',[[2,'🌟 아주 좋음'],[1,'🙂 보통'],[0,'🌱 아쉬움']],d.att)}</div></div>

function setChips(){const set=S.wordsets.find(w=>w.id===(draft&&draft.setId));return set?set.words.map((w,i)=>`<button type="button" class="chip tg ${(draft.wrongIdx||[]).includes(i)?'on':''}" onclick="toggleWord(${i},this)">${esc(w.q)}${w.ans?' · '+esc(w.ans):''}</button>`).join(''):''}
function pickSet(v){draft.setId=v;draft.wrongIdx=[];$('dSetChips').innerHTML=setChips();syncWordSet()}
function toggleWord(i,b){const a=draft.wrongIdx||(draft.wrongIdx=[]),k=a.indexOf(i);k>=0?a.splice(k,1):a.push(i);b.classList.toggle('on');syncWordSet()}
function syncWordSet(){const set=S.wordsets.find(w=>w.id===draft.setId);if(!set)return;const wr=(draft.wrongIdx||[]).slice().sort((a,b)=>a-b).map(i=>set.words[i]);$('dT').value=set.words.length;$('dN').value=set.words.length-wr.length;$('dW').value=wr.map(w=>w.ans?w.q+'='+w.ans:w.q).join(', ')}
function chgDate(v){const st=getSt(curId);draft={...newDraft(st,v),sid:st.id};render()}
function readDraft(){draft.vN=$('dN').value;draft.vT=$('dT').value;draft.wordsRaw=$('dW').value;draft.gramRaw=$('dG').value;draft.sentence=$('dS').value;draft.note=$('dNote').value;draft.insight=$('dI').checked;draft.msg=$('dMsg').value;draft.date=$('dDate').value||draft.date}
function genDaily(bump){readDraft();if(bump)draft.seed=(draft.seed||0)+1;draft.msg=genMsg(getSt(curId),draft);$('dMsg').value=draft.msg}
function smsDaily(){
  readDraft();const st=getSt(curId);if(!draft.msg)return toast('먼저 문구를 만들어 주세요');
  if(!st.phone)return copyText(draft.msg),toast('휴대폰 번호가 없어 복사했어요 (정보 수정에서 입력)');
  location.href='sms:'+st.phone.replace(/[^0-9+]/g,'')+(/iPhone|iPad|Mac/.test(navigator.userAgent)?'&':'?')+'body='+encodeURIComponent(draft.msg);
}
function saveDaily(){
  const st=getSt(curId);readDraft();
  if(!draft.msg.trim()){draft.msg=genMsg(st,draft);$('dMsg').value=draft.msg}
  const key=draft.wordsRaw+'||'+draft.gramRaw,ex=st.daily.find(x=>x.date===draft.date);
  const ab=draft.attend==='a';
  const rec={id:ex?ex.id:uid(),date:draft.date,attend:draft.attend||'p',vN:(draft.vN===''||ab)?'':+draft.vN,vT:+draft.vT||0,wordsRaw:draft.wordsRaw,gramRaw:draft.gramRaw,att:draft.att,hw:draft.hw,sentence:draft.sentence,note:draft.note,tone:draft.tone,insight:draft.insight,msg:draft.msg,addedKey:key};
  if(!ex||ex.addedKey!==key){
    parseWords(draft.wordsRaw).forEach(w=>addWrong(st,{kind:'word',q:w.q,ans:w.ans,tag:/[A-Za-z]{8,}/.test(w.q)?'철자':'어휘'},draft.date));
    parseGram(draft.gramRaw).forEach(g=>addWrong(st,{kind:'grammar',q:g.q,ans:g.ans,tag:g.tag},draft.date));
  }
  if(ex)st.daily[st.daily.indexOf(ex)]=rec;else st.daily.push(rec);
  st.scores=st.scores.filter(s=>s.src!==rec.id);
  if(rec.vN!==''&&rec.vT>0)st.scores.push({id:uid(),date:rec.date,subject:S.subjects.includes('단어')?'단어':S.subjects[0],score:Math.round(rec.vN/rec.vT*100),type:'오늘 단어시험',tags:[],comment:'',src:rec.id});
  if(ab&&!(st.makeups||[]).some(m=>m.date===rec.date)){(st.makeups=st.makeups||[]).push({id:uid(),date:rec.date,reason:'',status:'예정',makeupDate:'',time:'',content:''});toast('결석 → 보충 수업 목록에 올렸어요 🔁')}
  pk(st,['daily','scores','wrongs','makeups']).then(()=>toast('저장했어요 ✓ 학부모 앱에 게시됐어요'));
  draft=null;render();
}

function tScore(st){

function liveDelta(){
  const el=$('sLive'),st=getSt(curId);if(!el||!st)return;
  const sub=$('sA').value,v=$('sV').value,d=$('sD').value||today();
  if(v===''){el.textContent='';return}
  const prev=[...st.scores].filter(r=>r.subject===sub&&String(r.date)<d).sort(byAsc).pop();
  const pv=prev?prev.score:($('sPrev').value!==''?+$('sPrev').value:null);
  el.innerHTML=pv===null?'지난번 기록이 없어요. 아래에 지난 시험 점수를 넣으면 변화를 계산해요.':`지난번 ${pv}점 → 이번 ${+v}점 <b class="${clsD(+v-pv)}">${fmtD(+v-pv)}</b>`;
}
function addScore(id){
  const st=getSt(id),raw=$('sV').value;if(raw==='')return alert('점수를 입력해 주세요.');
  const v=+raw,avgRaw=$('sAvg').value,prevRaw=$('sPrev').value,chg=$('sChg').value.trim();
  if([raw,avgRaw,prevRaw].some(x=>x!==''&&(+x<0||+x>100)))return alert('점수는 0~100 사이로 입력해 주세요.');
  const rec={id:uid(),date:$('sD').value||today(),subject:$('sA').value,score:v,type:$('sT').value,tags:[...document.querySelectorAll('#scTags .tg.on')].map(b=>b.textContent),comment:$('sC').value.trim()};
  if(avgRaw!=='')rec.avg=+avgRaw;
  if(prevRaw!=='')rec.prevScore=+prevRaw;
  if(chg)rec.chg=chg;
  st.scores.push(rec);
  pk(st,['scores']);toast('저장했어요');render();
}
function delScore(sid,rid){if(!confirm('이 기록을 삭제할까요?'))return;const st=getSt(sid);st.scores=st.scores.filter(r=>r.id!==rid);pk(st,['scores']);render()}

}
function tWrong2(st){

   <div class="card"><h2>직접 추가</h2><div class="row"><div class="field"><label>종류</label><select id="wK"><option value="word">단어</option><option value="grammar">문법</option></select></div><div class="field"><label>태그</label><select id="wTag">${S.tags.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div></div>
    <div class="field"><label>틀린 단어 / 문장</label><input id="wQ"></div><div class="field"><label>뜻 / 바른 문장</label><input id="wA"></div><button class="btn outline block" onclick="manualWrong('${st.id}')">추가</button></div>
   <div class="seg" style="margin-bottom:10px"><button class="${wfilter==='open'?'on':''}" onclick="wfilter='open';render()">복습 필요</button><button class="${wfilter==='all'?'on':''}" onclick="wfilter='all';render()">전체</button></div>

function manualWrong(id){const st=getSt(id),q=$('wQ').value.trim();if(!q)return;addWrong(st,{kind:$('wK').value,q,ans:$('wA').value.trim(),tag:$('wTag').value},today());pk(st,['wrongs']);render()}

function makeTest(){
  const st=getSt(curId),n=+$('tN').value,key=$('tK').checked;

  const items=pool.slice(0,n);st.lastTest={date:today(),ids:items.map(i=>i.id)};pk(st,['lastTest']);

  if(words.length){q+='<h3>A. 단어</h3>';k+='<h3>A. 단어</h3>';words.forEach((w,i)=>{no++;const toEn=w.ans&&i%2===0;

    k+=`<div>${no}. ${toEn?esc(w.q):esc(w.ans||'(뜻 미입력)')}</div>`})}
  if(gram.length){q+='<h3>B. 문법 · 바르게 고쳐 쓰세요</h3>';k+='<h3>B. 문법</h3>';gram.forEach(w=>{no++;
    q+=`<div class="it">${no}. ${esc(w.q)}<br>→ <span class="ln" style="min-width:90%"></span></div>`;k+=`<div>${no}. ${esc(w.ans||'(정답 미입력)')}</div>`})}
  const nm=esc(st.name.replace(/\(.*?\)/g,''));

/* ---------- 학습 갭 · 반 전체 약점 ---------- */
function gapReport(st){
  const items=[],open=st.wrongs.filter(w=>!w.mastered),byTag={};
  open.forEach(w=>{const t=w.tag||'기타',v=byTag[t]=byTag[t]||{n:0,c:0,ex:[]};v.n++;v.c+=w.count;if(v.ex.length<3)v.ex.push(w.q)});
  Object.entries(byTag).sort((a,b)=>b[1].c-a[1].c).slice(0,3).forEach(([t,v])=>items.push({title:`‘${t}’ 복습이 필요해요 (${v.n}개)`,detail:`누적 ${v.c}번 틀렸어요 · 예: ${v.ex.join(', ')}`}));
  const rep=open.filter(w=>w.count>=3);if(rep.length)items.push({title:`3번 이상 틀린 항목 ${rep.length}개`,detail:rep.slice(0,4).map(w=>w.q).join(', ')});
  const rd=[...st.daily].sort(byDesc).slice(0,5),miss=rd.filter(d=>d.attend!=='a'&&d.hw<2).length;
  if(rd.length>=3&&miss>=2)items.push({title:`최근 ${rd.length}번 중 숙제 미완료 ${miss}번`,detail:'숙제 습관을 같이 잡아 가요'});
  const pm=(st.makeups||[]).filter(m=>m.status==='예정').length;if(pm)items.push({title:`보충 수업 ${pm}건이 남았어요`,detail:'결석해서 놓친 내용을 보충으로 채워요'});
  const dr=deltas(st).filter(x=>x.delta!==null&&x.delta<=-S.alertDrop);if(dr.length)items.push({title:`점수가 내려간 영역: ${dr.map(x=>x.sub).join(', ')}`,detail:'해당 영역 오답부터 먼저 복습해요'});
  return items;
}
function gapHtml(st){const g=gapReport(st);return `<div class="card"><h2>🧩 학습 갭 <small>아직 채워야 할 부분</small></h2>${g.length?g.map(x=>`<div class="ins best"><i></i><div><b>${esc(x.title)}</b><div class="note">${esc(x.detail)}</div></div></div>`).join(''):'<div class="empty">지금은 눈에 띄는 갭이 없어요 👏</div>'}</div>`}

const STOP=new Set('about after again also because before being could every first from have into just like more most much other should their there these they this those through very what when where which while with would your'.split(' '));
function reviewSections(tpl,secs){
  const modelWords=tpl&&tpl.model?[...new Set((tpl.model.toLowerCase().match(/[a-z']{5,}/g)||[]).filter(w=>!STOP.has(w)))]:[];
  const all=secs.map(x=>x.text).join(' ').toLowerCase();
  const items=secs.map((x,i)=>{
    const def=(tpl&&tpl.sections&&tpl.sections[i])||{},text=x.text.trim(),issues=[];
    const words=(text.match(/[A-Za-z']+/g)||[]).length,nl=lines(text).length;
    if(!text)issues.push('비어 있어요');
    else{
      if(def.min&&(tpl.kind==='tchart'?nl:words)<def.min)issues.push(tpl.kind==='tchart'?`최소 ${def.min}줄이 필요해요 (지금 ${nl}줄)`:`최소 ${def.min}단어가 필요해요 (지금 ${words}단어)`);
      (def.req||[]).forEach(ph=>{if(ph&&!text.toLowerCase().includes(ph.toLowerCase()))issues.push(`‘${ph}’ 표현이 빠졌어요`)});
    }

    return {label:x.label,words,issues,sugs:r.sugs};

  return {items,modelTotal:modelWords.length,modelHit:modelWords.length-modelWords.filter(w=>!all.includes(w)).length,missing,summary:`${items.length}칸 중 ${okN}칸이 깔끔해요`};
}

function lcsPairs(P,M){
  const n=P.length,m=M.length,L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=P[i]===M[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<n&&j<m){if(P[i]===M[j]){out.push([i,j]);i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
  return out;
}

function analyzeCard(words,modelText,strict){
  const stat={fix:0,x:0,m:0,skip:0,unc:0,note:0,marks:0,noMatch:false};
  const real=words.filter(w=>{if(w.red==='text'){stat.note++;return false}return nw(w.t)});
  const P=real.map(w=>w.t),Pn=P.map(nw),Mt=toks(modelText),Mn=Mt.map(nw);
  stat.marks=real.filter(w=>w.red==='mark').length;
  const useRed=strict&&stat.marks>0,segs=[];
  const okRange=(a,b)=>{for(let i=a;i<b;i++)segs.push({t:'o',w:P[i]})};
  const pairs=lcsPairs(Pn,Mn);
  if(!pairs.length){stat.noMatch=true;okRange(0,P.length);return {segs:mergeSegs(segs),stat}}
  const conf=(a,b)=>{for(let q=Math.max(0,a-1);q<=Math.min(P.length-1,b);q++)if(real[q].red==='mark')return true;return false};
  const cand=(t,w,a,ps,pe)=>{const c=conf(ps,pe),on=!useRed||c;if(!on)stat.unc++;stat[t==='f'?'fix':t==='x'?'x':'m']++;segs.push({t,w,a,on})};
  const proc=(ps,pe,ms,me)=>{
    const pl=pe-ps,ml=me-ms;if(!pl&&!ml)return;
    if(Math.max(pl,ml)>8){okRange(ps,pe);stat.skip++;return}
    if(pl&&ml){
      if(pl===ml){for(let q=0;q<pl;q++){if(Pn[ps+q]===Mn[ms+q])okRange(ps+q,ps+q+1);else cand('f',P[ps+q],Mt[ms+q],ps+q,ps+q+1)}}
      else cand('f',P.slice(ps,pe).join(' '),Mt.slice(ms,me).join(' '),ps,pe);
    }else if(pl)cand('x',P.slice(ps,pe).join(' '),'',ps,pe);
    else cand('m','',Mt.slice(ms,me).join(' '),ps,ps);
  };
  const f=pairs[0],l=pairs[pairs.length-1];
  if(f[0]>0){const a=f[0],b=f[1],k=Math.min(a,b);if(a<=3&&k===a)proc(0,a,b-k,b);else okRange(0,a)}
  okRange(f[0],f[0]+1);
  for(let t=1;t<pairs.length;t++){const [a1,b1]=pairs[t-1],[a2,b2]=pairs[t];proc(a1+1,a2,b1+1,b2);okRange(a2,a2+1)}
  const r=P.length-l[0]-1;
  if(r>0){const k=Math.min(Mt.length-l[1]-1,r);if(r<=3&&k===r)proc(l[0]+1,P.length,l[1]+1,l[1]+1+k);else okRange(l[0]+1,P.length)}
  return {segs:mergeSegs(segs),stat};
}
function mergeSegs(s){const o=[];for(const x of s){const p=o[o.length-1];if(x.t==='o'&&p&&p.t==='o')p.w+=' '+x.w;else o.push({...x})}return o}
function finalParts(segs){
  const out=[];
  for(const s of segs){
    if(s.t==='o'||!s.on){if(s.t==='m')continue;out.push({t:'o',w:s.w})}
    else out.push({t:s.t,w:s.w,a:s.a,d:0});
  }
  return mergeSegs(out);
}
/* 빨간 펜 판별: 단어 상자 안이 거의 빨강이면 선생님 글씨('text'), 단어 주변에 빨간 밑줄·동그라미가 있으면 'mark' */
function redOf(img,W,H,b){
  const px=(x,y)=>{const i=(y*W+x)*4;return [img[i],img[i+1],img[i+2]]};
  const isRed=(r,g,bl)=>r>140&&r-g>70&&r-bl>70, isDark=(r,g,bl)=>r+g+bl<420&&!isRed(r,g,bl);
  const h=Math.max(4,b.y1-b.y0),pad=Math.round(h*.35);
  const X0=Math.max(0,Math.floor(b.x0-pad)),X1=Math.min(W-1,Math.ceil(b.x1+pad)),Y0=Math.max(0,Math.floor(b.y0-pad)),Y1=Math.min(H-1,Math.ceil(b.y1+Math.round(h*.5)));
  let inR=0,inD=0,nearR=0;
  for(let y=Y0;y<=Y1;y++)for(let x=X0;x<=X1;x++){
    const [r,g,bl]=px(x,y),inside=x>=b.x0&&x<=b.x1&&y>=b.y0&&y<=b.y1;
    if(isRed(r,g,bl)){if(inside)inR++;else nearR++}else if(inside&&isDark(r,g,bl))inD++;
  }
  const w=Math.max(1,b.x1-b.x0);
  if(inR>=Math.max(3,.02*w*h)&&inR/(inR+inD+1e-9)>.6)return 'text';
  if(nearR>=.6*w||inR>=.15*w*h*.3&&inR/(inR+inD+1e-9)>.2)return 'mark';
  return '';
}
async function cardOcr(inp){
  const f=inp.files[0];if(!f)return;
  showLoading(true,'사진을 준비하는 중…');
  try{
    if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
    const bm=await createImageBitmap(f),sc=Math.min(1,1800/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');
    cv.width=Math.round(bm.width*sc);cv.height=Math.round(bm.height*sc);
    const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(bm,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    const res=await Tesseract.recognize(blob,'eng',{logger:m=>{if(m.status==='recognizing text')showLoading(true,'글자를 읽는 중… '+Math.round(m.progress*100)+'%')}});
    let ws=res.data.words;
    if(!ws){ws=[];(res.data.blocks||[]).forEach(b=>(b.paragraphs||[]).forEach(p=>(p.lines||[]).forEach(l=>(l.words||[]).forEach(w=>ws.push(w)))))}
    showLoading(true,'빨간 표시를 찾는 중…');
    const id=cx.getImageData(0,0,cv.width,cv.height).data;
    cd.words=ws.filter(w=>w.text&&w.text.trim()).map(w=>({t:w.text.trim(),red:redOf(id,cv.width,cv.height,w.bbox)}));
    cd.auto=cd.words.filter(w=>w.red!=='text').map(w=>w.t).join(' ');cd.ptxt=cd.auto;cd.segs=null;
    toast('읽었어요. 아래에서 확인하고 [분석하기]를 눌러요');
  }catch(e){console.error(e);toast('⚠️ 사진을 읽지 못했어요. 글자를 직접 붙여 넣어 주세요')}
  showLoading(false);inp.value='';render();
}

let AI=null;
const AI_MODEL='claude-sonnet-5-5';
async function aiRead(files,t,pg){
  files=[].concat(files);const imgs=[];
  for(const file of files){const bm=await createImageBitmap(file),sc=Math.min(1,1600/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');
    cv.width=Math.round(bm.width*sc);cv.height=Math.round(bm.height*sc);cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
    imgs.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:cv.toDataURL('image/jpeg',.85).split(',')[1]}})}
  const qs=t.qs.filter(q=>q.n>=pg[0]&&q.n<=pg[1]);
  const desc=qs.map(q=>q.t==='mc'?`${q.n}. [객관식] ${q.q} / ${q.o.map((o,i)=>LET[i]+'. '+o).join(' / ')}`:q.t==='ch'?`${q.n}. [지문 속 동그라미] ${q.q} / a. ${q.o[0]} / b. ${q.o[1]}`:`${q.n}. [문장쓰기] 주어진 단어: ${q.q}`).join('\n');
  const prompt=`영어 시험지에 학생이 직접 답한 사진 ${files.length}장입니다(쪽 순서는 뒤섞여 있을 수 있어요). 아래 문항에 대해 학생이 실제로 한 답만 읽어 주세요. 정답을 추측하거나 고쳐 주지 마세요.
${desc}
규칙:
- 객관식: 학생이 연필로 체크(✓)·동그라미·사선을 그은 보기 글자(a~d). 표시가 없거나 불확실하면 null.
- 지문 속 동그라미: 학생이 동그라미 친 쪽이 첫 번째면 "a", 두 번째면 "b". 불확실하면 null.
- 문장쓰기: 주어진 단어를 배열해 쓴 문장입니다. 학생이 쓴 단어와 순서를 보이는 그대로 옮겨 적되, 글씨 모양 때문에 애매한 글자(u/n/v, a/o, e/c, i/l 등)는 주어진 단어의 철자로 해석하세요. 단어를 빼거나 더하거나 형태를 바꾼 것(예: want→wants, go→goes)과 순서는 보이는 그대로 적으세요. 비어 있으면 "".
JSON 한 개만 출력: {"1":"c","11":"How can I help you?","16":"a"} (문항 번호를 키로, 사진에서 찾을 수 없는 번호는 null)`;
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':AI.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:AI.model||AI_MODEL,max_tokens:2500,messages:[{role:'user',content:[...imgs,{type:'text',text:prompt}]}]})});
  if(!r.ok){const e=await r.text();throw new Error('AI '+r.status+' '+e.slice(0,160))}
  const j=await r.json(),txt=(j.content||[]).map(x=>x.text||'').join(''),m=txt.match(/\{[\s\S]*\}/);
  if(!m)throw new Error('AI 응답을 읽지 못했어요');
  return JSON.parse(m[0]);
}
function aiApply(res,t,pg){
  const out={};
  t.qs.filter(q=>q.n>=pg[0]&&q.n<=pg[1]).forEach(q=>{
    const v=res[String(q.n)];
    if(q.t==='sa'){if(typeof v==='string'&&v.trim()){ts.txt[q.n]=v;const st=saJudge(q,v).state;out[q.n]=st==='x'?'x':'ok';if(st==='chk')ts.chk[q.n]=1;else delete ts.chk[q.n]}else out[q.n]='?'}
    else out[q.n]=(typeof v==='string'&&LET.includes(v.toLowerCase())&&LET.indexOf(v.toLowerCase())<q.o.length)?v.toLowerCase():'?';
  });
  return out;
}

/* 정답지 사진 → 정답표 텍스트 (AI) */
async function aiKeySheet(files){
  files=[...files];const imgs=[];
  for(const file of files){const bm=await createImageBitmap(file),sc=Math.min(1,1600/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');
    cv.width=Math.round(bm.width*sc);cv.height=Math.round(bm.height*sc);cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
    imgs.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:cv.toDataURL('image/jpeg',.85).split(',')[1]}})}
  const prompt=`영어 시험 정답지 사진 ${files.length}장입니다(쪽 순서가 뒤섞여 있을 수 있어요). 시험 전체를 아래 형식의 텍스트로 옮겨 적어 주세요. 설명 없이 텍스트만 출력하세요.
첫 줄: 이름: 시험지 제목 (예: 이름: C-2 Grammar in Context 1B Test 1 (Week 9))
둘째 줄: 쪽: 사진 한 장당 문항 번호 범위를 번호 순서로 (예: 쪽: 1-8, 9-15, 16-20)
이후 문항마다 한 줄: 번호|유형|문제|보기|정답
- mc(4지선다): 문제는 빈칸을 ____ 로, 보기는 a→d 순서대로 ; 로 구분, 정답은 연필 체크·동그라미·사선이 표시된 보기 글자(a~d)
- ch(지문 속 두 보기 중 동그라미): 문제는 그 문장 일부를 ( ___ ) 로 표시, 보기 두 개를 ; 로 구분, 정답은 동그라미 친 쪽이 첫째면 a, 둘째면 b
- sa(주어진 단어를 배열해 문장 쓰기): 문제는 주어진 단어를 " / " 로 이어서, 보기 칸에는 -, 정답은 손으로 쓴 문장을 대소문자·마침표까지 보이는 그대로
표시가 안 보이거나 불확실하면 정답을 ? 로 쓰세요. 보이는 대로만 옮기고 문법적으로 고치지 마세요.`;
  return aiPost([...imgs,{type:'text',text:prompt}],4000);
}
async function aiPost(content,max){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':AI.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:AI.model||AI_MODEL,max_tokens:max,messages:[{role:'user',content}]})});
  if(!r.ok){const e=await r.text();throw new Error('AI '+r.status+' '+e.slice(0,160))}
  const j=await r.json();return (j.content||[]).map(x=>x.text||'').join('');
}

async function importRows(rows){
  const res={added:0,updated:0,skipped:0,sensitive:0};
  if(!rows.length)return res;
  const m={};
  Object.keys(rows[0]).forEach(k=>{const h=String(k).trim();if(/주민|resident|ssn|rrn/i.test(h)){res.sensitive++;return}for(const [f,re] of HMAP){if(!m[f]&&re.test(h)){m[f]=k;return}}});
  const g=(r,f)=>m[f]?String(r[m[f]]??'').trim():'';
  for(const r of rows){
    const name=g(r,'name');if(!name){res.skipped++;continue}
    let digits=g(r,'no').replace(/\D/g,'');
    if(digits.length>4){res.sensitive++;digits=''}
    const no=digits?digits.padStart(4,'0'):'',en=g(r,'en');
    const ex=S.students.find(s=>s.name===name&&(no?s.no===no:(!en||s.en===en)));
    if(ex){
      if(en)ex.en=en;if(no)ex.no=no;['grade','parent','phone'].forEach(f=>{const v=g(r,f);if(v)ex[f]=v});
      await pk(ex,['en','no','grade','parent','phone']);res.updated++;
    }else{
      const st={id:newToken(),...normFields({name,en,no,grade:g(r,'grade'),parent:g(r,'parent'),phone:g(r,'phone')}),diary:[],books:[],msgs:[],works:[]};
      await FB.createKid(st.id,{...kidDoc(st),createdAt:Date.now()});S.students.push(st);res.added++;
    }
  }
  return res;
}
function importXlsx(inp){
  const f=inp.files[0];if(!f)return;
  if(typeof XLSX==='undefined')return alert('엑셀 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const wb=XLSX.read(r.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      showLoading(true);const x=await importRows(rows);showLoading(false);
      alert(`가져오기 완료\n새로 추가 ${x.added}명 · 업데이트 ${x.updated}명 · 건너뜀 ${x.skipped}${x.sensitive?`\n⚠️ 주민등록번호 등 민감한 열/값 ${x.sensitive}건은 무시했어요.`:''}`);
      inp.value='';rRoster();
    }catch(e){showLoading(false);fail(e)}
  };
  r.readAsArrayBuffer(f);
}

  },e=>{showLoading(false);blocked={title:'불러오지 못했어요',text:errText(e)};render()}));

  render();

function start(){
  FB.onAuth(async user=>{
    const p=new URLSearchParams(location.search),k=p.get('k');
    if(p.has('t')){try{localStorage.removeItem(PKEY)}catch(e){}}
    if(k){try{localStorage.setItem(PKEY,k)}catch(e){}}
    let stored=null;try{stored=localStorage.getItem(PKEY)}catch(e){}
    const tok=k||stored,teacher=FB.isTeacher(user);
    showLoading(false);
    if(user&&!user.isAnonymous&&!teacher){loginNote='선생님 계정이 아니에요.';try{await FB.logout()}catch(e){}return}
    if(teacher&&!k){if(entered!=='teacher'){entered='teacher';await enterTeacher()}return}
    if(tok){
      if(!user){try{await FB.anon()}catch(e){blocked={title:'접속 준비 중 문제가 생겼어요',text:errText(e)};render()}return}
      const key='parent:'+tok;if(entered!==key){entered=key;await enterParent(tok)}return
    }
    entered=null;role=null;render();
  });
}
addEventListener('error',e=>{console.error(e.error||e.message);showLoading(false);if(!document.querySelector('.view.active')){blocked={title:'화면 오류',text:String(e.message||'알 수 없는 오류')};try{render()}catch(_){}}else toast('⚠️ '+String(e.message||'오류'))});
render();
if(window.FB)start();
else{

}
